server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static frontend assets
    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse proxy to customer-service - single origin for the browser,
    # so no CORS configuration is needed on the backend. This also mirrors
    # the path-based routing an Ingress controller will do in Phase 7.
    location /api/customers/ {
        proxy_pass http://customer-service:8081/api/customers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy to account-service
    # location /api/accounts/ {
    #    proxy_pass http://account-service:8082/api/accounts/;
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    # }
    location /api/accounts {
    proxy_pass http://account-service:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }
}
