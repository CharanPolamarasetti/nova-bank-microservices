<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nova Bank - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <h1>Nova Bank</h1>
        <button id="logoutBtn">Logout</button>
    </header>

    <main class="dashboard">
        <section class="panel">
            <h2>My Accounts</h2>
            <div id="accountsList" class="accounts-list"></div>
        </section>

        <section class="panel">
            <h2>Transfer Funds</h2>
            <form id="transferForm">
                <label>From Account</label>
                <select id="fromAccount" required></select>
                <label>To Account Number</label>
                <input type="text" id="toAccount" placeholder="NB0000000000" required>
                <label>Amount</label>
                <input type="number" id="amount" min="0.01" step="0.01" required>
                <label>Description</label>
                <input type="text" id="description" placeholder="Optional">
                <button type="submit">Send Transfer</button>
            </form>
            <p id="transferMessage" class="message"></p>
        </section>

        <section class="panel">
            <h2>Transaction History</h2>
            <label>Account</label>
            <select id="historyAccount"></select>
            <table id="transactionsTable">
                <thead>
                    <tr><th>Date</th><th>From</th><th>To</th><th>Amount</th><th>Description</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section class="panel">
            <h2>Beneficiaries</h2>
            <label>Account</label>
            <select id="beneficiaryAccount"></select>
            <ul id="beneficiariesList"></ul>

            <form id="beneficiaryForm">
                <label>Beneficiary Account Number</label>
                <input type="text" id="benAccountNumber" required>
                <label>Beneficiary Name</label>
                <input type="text" id="benName" required>
                <label>Nickname</label>
                <input type="text" id="benNickname">
                <button type="submit">Add Beneficiary</button>
            </form>
        </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
